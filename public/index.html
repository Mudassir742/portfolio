    <!--
      Tags marked data-default="true" are the pre-JS fallback: what a
      crawler that never executes JavaScript (Facebook/Twitter/LinkedIn/
      Slack unfurlers, and CRA has no server-side render step) will see,
      always describing the homepage since there's no way to vary this
      per-route without JS. src/index.js strips these once on boot, before
      React ever mounts, so real browsers, Googlebot's renderer, and any
      other JS-executing consumer see exactly one clean set of tags - the
      per-route ones <Seo> (src/components/seo/Seo.js) renders via Helmet -
      instead of both sets stacked on top of each other.
    -->
